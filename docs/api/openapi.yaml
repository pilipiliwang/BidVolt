      type: object
      additionalProperties: false
      required: [action, expected_revision_id, content, structured]
      properties:
        action: { const: update }
        expected_revision_id: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        structured: { type: object, additionalProperties: true }
    RequirementMutationInput:
      oneOf:
        - $ref: '#/components/schemas/ConfirmRequirementInput'
        - $ref: '#/components/schemas/UpdateRequirementInput'
      discriminator:
        propertyName: action
        mapping:
          confirm: '#/components/schemas/ConfirmRequirementInput'
          update: '#/components/schemas/UpdateRequirementInput'
    ProjectSnapshotManifest:
      type: object
      additionalProperties: false
      required: [project_material_revision_ids, requirement_revision_ids, enterprise_asset_revision_ids, deliverable_version_ids, quote_sample_snapshot_id]
      properties:
        project_material_revision_ids: { type: array, items: { type: string } }
        requirement_revision_ids: { type: array, items: { type: string } }
        enterprise_asset_revision_ids: { type: array, items: { type: string } }
        deliverable_version_ids: { type: array, items: { type: string } }
        quote_sample_snapshot_id: { type: [string, 'null'] }
    ProjectSnapshot:
      type: object
      additionalProperties: false
      required: [snapshot_id, project_id, status, reason, manifest, content_hash, created_at]
      properties:
        snapshot_id: { type: string }
        project_id: { type: string }
        status: { const: frozen }
        reason: { type: string, enum: [task, review, check, export, manual] }
        manifest: { $ref: '#/components/schemas/ProjectSnapshotManifest' }
        content_hash: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        created_at: { type: string, format: date-time }
    ProjectSnapshotPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectSnapshot' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
    Task:
      type: object
      additionalProperties: false
      required: [task_id, project_id, project_snapshot_id, phase, status, percent, public_message, error_code, created_at, updated_at]
      properties:
        task_id: { type: string }
        project_id: { type: string }
        project_snapshot_id: { type: [string, 'null'] }
        phase: { type: string, maxLength: 64 }
        status:
          type: string
          enum: [queued, running, waiting_user, retrying, cancel_requested, cancelled, superseded, succeeded, failed, dead_letter]
        percent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        public_message: { type: string, maxLength: 500 }
        error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublicTaskEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, sequence, task_id, project_id, phase, status, percent, public_message, error_code, occurred_at]
      properties:
        schema_version: { const: '1' }
        event_id: { type: string }
        sequence: { type: integer, minimum: 0 }
        task_id: { type: string }
        project_id: { type: string }
        phase: { type: string, maxLength: 64 }
        status:
          type: string
          enum: [queued, running, waiting_user, retrying, cancel_requested, cancelled, superseded, succeeded, failed, dead_letter]
        percent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        public_message: { type: string, maxLength: 500 }
        error_code: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }
        result_refs:
          type: object
          additionalProperties: false
          properties:
            deliverable_ids: { type: array, items: { type: string } }
            requirement_revision_ids: { type: array, items: { type: string } }
            review_run_id: { type: string }
            quote_calculation_id: { type: string }
            check_id: { type: string }
            export_job_id: { type: string }
    ReviewProvider:
      type: object
