      properties:
        sample_id: { type: string }
        material_name: { type: string }
        material_code: { type: [string, 'null'] }
        spec: { type: [string, 'null'] }
        tenderer: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        win_price: { type: string, pattern: '^-?\\d+(?:\\.\\d+)?$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        tax_included: { type: boolean }
        unit: { type: string }
        win_date: { type: string, format: date }
        supplier: { type: [string, 'null'] }
        source_ref: { type: string }
    HistoryQuerySnapshot:
      type: object
      additionalProperties: false
      required: [read_only, provider_id, provider_version, query_snapshot_id, source_updated_at, samples, total, page, size, normalization_warnings]
      properties:
        read_only: { const: true }
        provider_id: { type: string }
        provider_version: { type: string }
        query_snapshot_id: { type: string }
        source_updated_at: { type: string, format: date-time }
        samples: { type: array, items: { $ref: '#/components/schemas/HistoryPriceSample' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
        normalization_warnings: { type: array, items: { type: string } }
    QuoteCalculationInput:
      type: object
      additionalProperties: false
      required: [project_snapshot_id, material_ref, cost, min_profit_rate, currency, tax_included, unit]
      properties:
        project_snapshot_id: { type: string }
        material_ref: { type: string }
        cost: { type: string }
        min_profit_rate: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        tax_included: { type: boolean }
        unit: { type: string }
    QuoteCalculation:
      oneOf:
        - $ref: '#/components/schemas/CalculatedQuote'
        - $ref: '#/components/schemas/QuoteNeedsInput'
        - $ref: '#/components/schemas/InsufficientQuote'
        - $ref: '#/components/schemas/QuoteConstraintViolation'
      discriminator:
        propertyName: status
        mapping:
          calculated: '#/components/schemas/CalculatedQuote'
          needs_input: '#/components/schemas/QuoteNeedsInput'
          insufficient_data: '#/components/schemas/InsufficientQuote'
          constraint_violation: '#/components/schemas/QuoteConstraintViolation'
    CalculatedQuote:
      type: object
      additionalProperties: false
      required: [calc_id, project_snapshot_id, algorithm_version, created_at, status, sample_snapshot_id, confidence_interval, normalized_input, excluded_sample_count, strategies]
      properties:
        calc_id: { type: string }
        project_snapshot_id: { type: string }
        algorithm_version: { type: string }
        created_at: { type: string, format: date-time }
        status: { const: calculated }
        sample_snapshot_id: { type: string }
        confidence_interval:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: { type: string }
            max: { type: string }
        normalized_input:
          type: object
          additionalProperties: false
          required: [currency, tax_included, unit]
          properties:
            currency: { type: string }
            tax_included: { type: boolean }
            unit: { type: string }
        excluded_sample_count: { type: integer, minimum: 0 }
        strategies:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/QuoteStrategy' }
    QuoteStrategy:
      type: object
      additionalProperties: false
      required: [strategy_id, strategy, suggested_price, score, gross_margin, risk_level, basis]
      properties:
        strategy_id: { type: string }
        strategy: { type: string, enum: [win, balance, profit] }
        suggested_price: { type: string }
        score: { type: [string, 'null'] }
        gross_margin: { type: string }
        risk_level: { type: string, enum: [low, medium, high] }
        basis: { type: array, items: { type: string } }
    QuoteNeedsInput:
      type: object
      additionalProperties: false
      required: [calc_id, project_snapshot_id, algorithm_version, created_at, status, missing_fields, message]
      properties:
        calc_id: { type: string }
        project_snapshot_id: { type: string }
        algorithm_version: { type: string }
        created_at: { type: string, format: date-time }
        status: { const: needs_input }
        missing_fields: { type: array, minItems: 1, items: { type: string } }
        message: { type: string }
    InsufficientQuote:
      type: object
      additionalProperties: false
      required: [calc_id, project_snapshot_id, algorithm_version, created_at, status, observed_sample_count, required_sample_count, message]
      properties:
        calc_id: { type: string }
        project_snapshot_id: { type: string }
        algorithm_version: { type: string }
        created_at: { type: string, format: date-time }
        status: { const: insufficient_data }
        observed_sample_count: { type: integer, minimum: 0 }
        required_sample_count: { type: integer, minimum: 1 }
        message: { type: string }
    QuoteConstraintViolation:
      type: object
      additionalProperties: false
      required: [calc_id, project_snapshot_id, algorithm_version, created_at, status, violations, message]
      properties:
        calc_id: { type: string }
        project_snapshot_id: { type: string }
        algorithm_version: { type: string }
        created_at: { type: string, format: date-time }
        status: { const: constraint_violation }
        violations: { type: array, minItems: 1, items: { type: string } }
        message: { type: string }
    ApplyQuoteInput:
      type: object
      additionalProperties: false
      required: [strategy_id, expected_version_id, confirmed]
      properties:
        strategy_id: { type: string }
        expected_version_id: { type: string }
        confirmed: { const: true }
    ApplyQuoteResult:
      type: object
      additionalProperties: false
      required: [deliverable_id, new_version_id, audit_log_id]
      properties:
        deliverable_id: { type: string }
        new_version_id: { type: string }
        audit_log_id: { type: string }
