        version: { type: string }
        status: { type: string, enum: [available, degraded, unavailable] }
        capabilities: { type: array, items: { type: string, enum: [score, risk, evidence, suggestion] } }
        allowed_data_scope:
          type: array
          items: { type: string, enum: [requirements, deliverables, enterprise_facts, quote_snapshot] }
