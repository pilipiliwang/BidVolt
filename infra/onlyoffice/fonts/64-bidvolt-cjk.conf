<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fallbacks, not renamed Windows fonts. 'accept' preserves a real original if installed. -->
  <!-- ONLYOFFICE also has its own font engine: fc-match alone is NOT proof of Office substitution. -->
  <alias binding="same"><family>SimSun</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>宋体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>NSimSun</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>新宋体</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>SimHei</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>黑体</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>Microsoft YaHei</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>微软雅黑</family><accept><family>Source Han Sans CN</family></accept></alias>
  <alias binding="same"><family>FangSong</family><accept><family>Zhuque Fangsong (technical preview)</family></accept></alias>
  <alias binding="same"><family>仿宋</family><accept><family>Zhuque Fangsong (technical preview)</family></accept></alias>
  <alias binding="same"><family>FangSong_GB2312</family><accept><family>Zhuque Fangsong (technical preview)</family></accept></alias>
  <alias binding="same"><family>仿宋_GB2312</family><accept><family>Zhuque Fangsong (technical preview)</family></accept></alias>
  <alias binding="same"><family>KaiTi</family><accept><family>LXGW WenKai</family></accept></alias>
  <alias binding="same"><family>楷体</family><accept><family>LXGW WenKai</family></accept></alias>
  <alias binding="same"><family>KaiTi_GB2312</family><accept><family>LXGW WenKai</family></accept></alias>
  <alias binding="same"><family>楷体_GB2312</family><accept><family>LXGW WenKai</family></accept></alias>
  <alias binding="same"><family>serif</family><accept><family>Source Han Serif CN</family></accept></alias>
  <alias binding="same"><family>sans-serif</family><accept><family>Source Han Sans CN</family></accept></alias>
</fontconfig>
